name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpcs
        if: matrix.php == '8.3'
      - name: php -l
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree (header, constant, readme Stable tag)
        run: |
          h=$(sed -n 's/^ \* Version: *//p' identvia-login.php | tr -d '[:space:]')
          c=$(sed -n "s/^define( 'IDENTVIA_LOGIN_VERSION', '\(.*\)' );/\1/p" identvia-login.php)
          r=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '[:space:]')
          echo "header=$h constant=$c stable_tag=$r"
          [ "$h" = "$c" ] && [ "$h" = "$r" ] || { echo "::error::Plugin versions disagree"; exit 1; }
          echo "VERSION=$h" >> "$GITHUB_ENV"
      - name: Build plugin zip
        run: |
          mkdir -p dist/identvia-login
          rsync -a --exclude-from=.distignore ./ dist/identvia-login/
          cd dist && zip -qr "identvia-login-$VERSION.zip" identvia-login
      - uses: actions/upload-artifact@v4
        with: { name: identvia-login, path: 'dist/identvia-login-*.zip' }
