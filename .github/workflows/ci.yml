name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpcs
        if: matrix.php == '8.3'
      - name: php -l
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: |
          mkdir -p dist/identvia-login
          rsync -a --exclude-from=.distignore ./ dist/identvia-login/
          cd dist && zip -qr identvia-login-0.1.0.zip identvia-login
      - uses: actions/upload-artifact@v4
        with: { name: identvia-login, path: dist/identvia-login-0.1.0.zip }
